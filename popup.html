<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log Time Colors</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        padding: 10px 15px;
        min-width: 320px; /* Adjust as needed */
        background-color: #f9f9f9;
        color: #333;
      }

      h1 {
        font-size: 1.2em;
        margin: 0 0 10px 0;
        color: #1a73e8; /* Google Blue */
        border-bottom: 1px solid #eee;
        padding-bottom: 5px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
        font-size: 0.9em;
        background-color: #fff;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
      }

      th,
      td {
        border: 1px solid #ddd;
        padding: 6px 8px;
        text-align: left;
        vertical-align: middle;
      }

      th {
        background-color: #f2f2f2;
        font-weight: 600;
      }

      tr:nth-child(even) {
        background-color: #f9f9f9;
      }

      .color-swatch {
        display: inline-block;
        width: 1em;
        height: 1em;
        border: 1px solid #ccc;
        margin-right: 6px;
        vertical-align: middle;
        border-radius: 2px;
      }
    </style>
  </head>
  <body>
    <h1>Log Timestamp Colors</h1>

    <table>
      <thead>
        <tr>
          <th>Time Since Log Entry</th>
          <th>Color</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Up to 1 minute</td>
          <td><span class="color-swatch swatch-segment_0_1"></span></td>
        </tr>
        <tr>
          <td>1 - 2 minutes</td>
          <td><span class="color-swatch swatch-segment_1_2"></span></td>
        </tr>
        <tr>
          <td>2 - 3 minutes</td>
          <td><span class="color-swatch swatch-segment_2_3"></span></td>
        </tr>
        <tr>
          <td>3 - 5 minutes</td>
          <td><span class="color-swatch swatch-segment_3_5"></span></td>
        </tr>
        <tr>
          <td>5 - 15 minutes</td>
          <td><span class="color-swatch swatch-segment_5_15"></span></td>
        </tr>
        <tr>
          <td>15 - 30 minutes</td>
          <td>
            <span class="color-swatch swatch-segment_15_30"></span>
          </td>
        </tr>
        <tr>
          <td>30 minutes - 1 hour</td>
          <td>
            <span class="color-swatch swatch-segment_30_60"></span>
          </td>
        </tr>
        <tr>
          <td>1 hour - 2 hours</td>
          <td>
            <span class="color-swatch swatch-segment_60_120"></span>
          </td>
        </tr>
        <tr>
          <td>2 hours - 5 hours</td>
          <td>
            <span class="color-swatch swatch-segment_120_300"></span>
          </td>
        </tr>
        <tr>
          <td>5 hours - 12 hours</td>
          <td>
            <span class="color-swatch swatch-segment_300_720"></span>
          </td>
        </tr>
        <tr>
          <td>12 hours - 1 day</td>
          <td>
            <span class="color-swatch swatch-segment_720_1440"></span>
          </td>
        </tr>
        <tr>
          <td>1 day - 2 days</td>
          <td>
            <span class="color-swatch swatch-segment_1440_2880"></span>
          </td>
        </tr>
        <tr>
          <td>2 days - 1 week</td>
          <td>
            <span class="color-swatch swatch-segment_2880_10080"></span>
          </td>
        </tr>
        <tr>
          <td>Over 1 week</td>
          <td><span class="color-swatch swatch-segment11"></span></td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
